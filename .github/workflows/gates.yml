name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact event revision
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Enforce the pull request net line budget
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            exit 0
          fi
          test -n "$BASE_REPOSITORY"
          test -n "$BASE_SHA"
          git fetch --unshallow origin "$HEAD_SHA"
          git fetch --no-tags --filter=blob:none \
            "https://github.com/${BASE_REPOSITORY}.git" "$BASE_SHA"
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          NET_LINES="$(
            git diff --numstat "$BASE_SHA...$HEAD_SHA" |
              awk '
                $1 == "-" || $2 == "-" { bad = 1; next }
                { net += $1 - $2 }
                END {
                  if (bad) {
                    print "binary diff cannot be counted" > "/dev/stderr"
                    exit 2
                  }
                  print net
                }
              '
          )"
          printf 'pull request net increase: %s lines\n' "$NET_LINES"
          test "$NET_LINES" -le 200

      - name: Install the checksum-locked uv release
        env:
          UV_VERSION: "0.9.21"
          UV_SHA256: "0a1ab27383c28ef1c041f85cbbc609d8e3752dfb4b238d2ad97b208a52232baf"
        run: |
          set -euo pipefail
          archive="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$UV_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Run every locked local gate
        run: |
          set -euo pipefail
          uv python install 3.14.2
          uv sync --locked --python 3.14.2
          uv run --locked pre-commit run --all-files
