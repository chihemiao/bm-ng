repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: locked-pytest
        name: locked pytest
        entry: uv run --locked python -B -m pytest -q
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: locked-ruff
        name: locked ruff
        entry: uv run --locked ruff check data execution ops reconciliation tests research
        language: unsupported
        pass_filenames: false
        always_run: true
