[build-system]
requires = ["uv_build==0.9.21"]
build-backend = "uv_build"

[project]
name = "hl-funding-carry"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["websockets==17.0.1"]

[dependency-groups]
dev = [
    "import-linter==2.13",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "vulture==2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
required-version = "==0.9.21"

[tool.uv.build-backend]
module-name = ["data", "execution"]
module-root = ""
namespace = true

[tool.vulture]
min_confidence = 80
paths = ["data", "execution"]

[tool.importlinter]
root_packages = ["data", "execution"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Runtime cannot import tests or research"
type = "forbidden"
source_modules = ["data", "execution"]
forbidden_modules = ["tests", "research"]
